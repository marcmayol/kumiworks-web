<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumi Works · En construcción</title>
<meta name="description" content="Kumi Works, agencia que diseña y construye software con IA: apps, webs y agentes. Abrimos pronto.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Kumi Works">
<meta property="og:description" content="Apps, webs y agentes con IA. Abrimos pronto.">
<meta property="og:url" content="https://kumiworks.dev/">
<meta name="theme-color" content="#0f0f10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f10'/%3E%3Cpath d='M20 16v32M20 32l16-16M26 26l14 22' stroke='%23f2b33d' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f10; --fg: #f4f1ea; --muted: #8d8a83; --accent: #f2b33d; --line: #26262a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); min-height: 100dvh;
    padding: clamp(20px, 4vw, 48px);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; background-position: -1px -1px;
  }
  body::before { /* fade the grid towards the edges */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 30% 50%, transparent 0%, var(--bg) 75%);
  }
  header, main, footer { position: relative; }
  header { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .02em; }
  .mark { width: 34px; height: 34px; }
  main { align-self: center; max-width: 900px; }
  .tag {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .85rem; color: var(--accent);
    display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px;
  }
  .tag::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 {
    font-size: clamp(2.4rem, 9vw, 6.5rem); line-height: .95; margin: 0 0 28px;
    font-weight: 700; letter-spacing: -.03em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  p { font-size: clamp(1.05rem, 2.2vw, 1.3rem); line-height: 1.5; color: var(--muted); max-width: 34em; margin: 0; }
  p strong { color: var(--fg); font-weight: 600; }
  .bar { margin-top: 44px; height: 4px; width: min(360px, 100%); background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 38%; background: var(--accent); animation: build 2.8s ease-in-out infinite alternate; }
  @keyframes build { from { transform: translateX(-100%); } to { transform: translateX(265%); } }
  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .8rem; color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) { .tag::before, .bar span { animation: none; } }
</style>
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1b1b1e"/><path d="M20 16v32M20 32l16-16M26 26l14 22" stroke="#f2b33d" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
    Kumi Works
  </header>

  <main>
    <div class="tag">en construcción</div>
    <h1>Estamos montando el <em>taller</em>.</h1>
    <p><strong>Kumi Works</strong> es una agencia pequeña que diseña y construye software con IA: apps, webs y agentes que trabajan de verdad. Abrimos pronto.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>

  <footer>
    <span>kumiworks.dev</span>
    <span>© 2026 Kumi Works</span>
  </footer>
</body>
</html>
